events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    # Das Log geht auf die Container-Ausgabe, damit "docker compose logs
    # frontend" den ganzen Verkehr zeigt und nicht nur die Hälfte.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;

        # Absichtlich "_": es gibt keinen Namen im Image. Der Aufbau funktioniert
        # über die IP der VM genauso wie über einen DNS-Namen, falls einer
        # eingerichtet wird.
        server_name _;

        # ------------------------------------------------------------------
        # Nur http, kein TLS. Das ist eine bewusste Entscheidung, kein
        # Versäumnis - die Begründung steht in der README unter "Grenzen".
        #
        # Kurz: für einen internen Namen gibt es kein öffentlich
        # vertrauenswürdiges Zertifikat. Die Alternativen wären ein
        # selbstsigniertes (ganzseitige Browser-Warnung auf JEDEM Rechner bei
        # JEDEM Besuch) oder eine eigene CA (Wurzelzertifikat von Hand auf
        # jeden Teilnehmerrechner). Beides ist für einen Workshop, in dem 15
        # Leute einfach eine Seite aufrufen sollen, der schlechtere Tausch.
        #
        # Folge, die offen dokumentiert ist: das Admin-Passwort läuft im
        # Klartext durchs LAN. Vertretbar in einem geschlossenen Kursnetz mit
        # genau einem Betreuer - und dieselbe Risikoklasse wie das Passwort im
        # Klartext in der .env auf dem Server.
        #
        # Nachrüsten ist ein Konfigurationsschritt, keine Codeänderung: das
        # Backend wertet X-Forwarded-Proto aus, und die Cookie-Politik steht auf
        # SameAsRequest - über https wird das Cookie damit von selbst Secure.
        # ------------------------------------------------------------------

        root /usr/share/nginx/html;
        index index.html;

        # Dockers eingebauter DNS. Zusammen mit der Variablen unten löst nginx
        # den Namen "backend" bei jeder Anfrage auf statt einmal beim Start.
        #
        # Der Unterschied ist betrieblich wichtig: mit einem festen Namen im
        # proxy_pass bricht nginx den START ab, wenn der Name gerade nicht
        # auflöst ("host not found in upstream"). Ein Backend, das sich neu
        # aufbaut, hätte damit die ganze Seite mitgenommen - Teilnehmer sähen
        # "Verbindung abgelehnt" statt einer Seite mit Fehlermeldung. So bleibt
        # die Seite stehen und der Aufruf endet sauber mit 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # -------------------------------------------------------- API ---------
        # Derselbe Ursprung wie die Seite. Damit entfällt CORS im Betrieb
        # vollständig, und das Anmelde-Cookie überquert keine Origin-Grenze.
        location /api/ {
            # $request_uri anhängen ist bei einer Variablen Pflicht: ohne den
            # ausdrücklichen Pfad würde nginx ihn verwerfen und jeden Aufruf
            # auf / des Backends schicken.
            proxy_pass $backend_upstream$request_uri;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Heute immer "http". Steht trotzdem hier, damit ein späterer
            # Wechsel auf https wirklich nur Konfiguration ist: das Backend
            # liest genau diesen Kopf (UseForwardedHeaders in Program.cs) und
            # setzt das Anmelde-Cookie danach auf Secure oder nicht.
            proxy_set_header X-Forwarded-Proto $scheme;

            # 10 MB, dieselbe Grenze wie SubmissionUploadLimits.MaxTotalSizeBytes.
            #
            # Die Voreinstellung von nginx ist 1 MB. Damit hätte der Proxy jede
            # Abgabe über 1 MB mit einer ENGLISCHEN HTML-Fehlerseite abgelehnt -
            # auch die, zu denen der Server einen fertigen deutschen Satz hat
            # ("„Gross.java“ ist größer als 1024 KB."). Nachgemessen: mit
            # dieser Zeile kommt der Satz durch.
            #
            # Was sie NICHT leistet: oberhalb der Gesamtgrenze antwortet nginx
            # mit 413 und englischem HTML. Dort gäbe es aber ohnehin keinen
            # deutschen Satz - ASP.NETs RequestSizeLimit bricht das Binden schon
            # vor der Validierung ab. Das Frontend blockt den Fall clientseitig,
            # ein Teilnehmer erreicht ihn also gar nicht.
            client_max_body_size 10m;

            # Eine Auswertung darf länger dauern als die Voreinstellung von 60s
            # (JUnitRunTimeoutSeconds plus Kompilieren plus Wartezeit in der
            # Schlange). Bricht der Proxy vorher ab, sieht der Teilnehmer einen
            # Fehler, während die Auswertung im Hintergrund noch läuft.
            proxy_read_timeout 300s;
        }

        # Der Healthcheck des Backends, damit er auch von außen erreichbar ist.
        location = /health {
            proxy_pass $backend_upstream/health;
            access_log off;
        }

        # ------------------------------------------------------- Seite --------
        location /assets/ {
            # Die Dateinamen tragen einen Hash aus dem Build - eine geänderte
            # Datei heißt anders. Damit ist ewiges Cachen sicher.
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            # react-router lebt im Browser: /aufgaben/<guid> ist keine Datei auf
            # der Platte. Ohne diese Zeile liefert ein direkt aufgerufener oder
            # neu geladener Unterpfad einen 404 - dieselbe Klasse Fehler wie
            # UseStatusCodePagesWithReExecute im alten Blazor-Frontend.
            try_files $uri $uri/ /index.html;

            # index.html selbst darf NIE gecacht werden: sie verweist auf die
            # gehashten Dateinamen. Eine alte index.html zeigt nach einer neuen
            # Fassung auf Dateien, die es nicht mehr gibt - die Seite bleibt weiß.
            add_header Cache-Control "no-cache";
        }
    }
}
