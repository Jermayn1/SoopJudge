<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      Hell oder dunkel muss feststehen, bevor irgendetwas gezeichnet wird.
      Wartet die Entscheidung auf React, steht die Seite beim Laden erst kurz
      weiss da und springt dann um. Deshalb ein kleines Skript hier oben, vor
      allem anderen.

      Dieselbe Regel steht in src/theme/theme.ts (resolveTheme). Wer sie hier
      aendert, aendert sie dort mit; theme.test.ts laesst dieses Skript gegen
      resolveTheme laufen und faellt sonst durch.
    -->
    <script id="theme-vorab">
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('soop-judge.theme')
        } catch (cause) {
          // Privates Fenster oder gesperrter Speicher. Dann gilt eben das
          // Betriebssystem, gemerkt wird nichts.
          console.warn('Die Wahl hell/dunkel ist nicht lesbar, es gilt das System.', cause)
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <!--
      Drei Angaben, weil ein Format allein nicht reicht: Safari benutzt
      SVG-Favicons nicht zuverlaessig und zeigte auf dem Mac gar kein Symbol,
      deshalb liegt das Zeichen nur noch als Rastergrafik vor. Die .ico traegt
      16 und 32 Pixel fuer aeltere Browser, die PNGs stehen fuer alle, die ein
      Format je Groesse waehlen koennen.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soop Judge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
